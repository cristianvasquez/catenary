name: Release

# A tag v* publishes the packages for Linux, Windows and macOS as a GitHub release. The tests do not run again: the gate job requires
# that the CI run on main (ci.yml, the full set after the merge) passed for the tagged commit. Each published package is started
# once: Linux under xvfb, Windows on windows-latest, macOS after the ad hoc signature.
# A manual run, or ci.yml for a change of this file or scripts/package.sh (release-dry), builds and starts the packages without a
# release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Wait up to 30 min for a CI run on main that is still in progress.
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")] | sort_by(.created_at) | last // empty')
            if [ -z "$run" ]; then
              echo "No CI run on main for $SHA. Merge the commit to main first; release only a commit that passed CI there."; exit 1
            fi
            status=$(jq -r .status <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run"); url=$(jq -r .html_url <<<"$run")
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && { echo "CI passed on main: $url"; exit 0; }
              echo "CI on main did not pass ($conclusion): $url"; exit 1
            fi
            echo "CI on main is $status: $url"; sleep 30
          done
          echo "CI on main did not end within 30 min"; exit 1

  package:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    # The oldest supported runner: the native modules that the Linux package keeps link against its glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # appimagetool needs desktop-file-validate.
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils xvfb
      - uses: ./.github/actions/setup
        with:
          install: full
      - run: pnpm build
      - name: Package
        env:
          CATENARY_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: |
          bash scripts/package.sh linux-x64 --appimage
          for target in win32-x64 darwin-x64 darwin-arm64; do
            bash scripts/package.sh "$target"
          done
      - name: Desktop smoke test (Linux package)
        run: xvfb-run -a node scripts/smoke-desktop.mjs dist/Catenary-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/Catenary-linux-x64.tar.gz
            dist/Catenary-linux-x64.AppImage
            dist/Catenary-win32-x64.zip
            dist/Catenary-darwin-*.zip
          if-no-files-found: error
      # The zip alone, for the smoke job of windows.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: release-win32-x64
          path: dist/Catenary-win32-x64.zip
          compression-level: 0
          retention-days: 7

  windows:
    needs: package
    uses: ./.github/workflows/windows.yml
    with:
      smoke: true
      artifact: release-win32-x64
      # The release zip has no example folder (no --example).
      launcher: false

  macos:
    # Apple silicon loads only signed code. Sign the app ad hoc (no Apple Developer ID) and make a disk image.
    needs: package
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Sign and make the disk image
        run: |
          set -euo pipefail
          name="Catenary-darwin-${{ matrix.arch }}"
          mkdir -p "out/$name"
          ditto -x -k "dist/$name.zip" "out/$name"
          app="out/$name/Catenary.app"
          # Native modules and executables outside the frameworks first, then the bundle.
          find "$app/Contents/Resources" -type f \( -name '*.node' -o -name rg -o -name spawn-helper \) -print0 |
            xargs -0 -n1 codesign --force --sign -
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p signed
          ditto -c -k --keepParent "$app" "signed/$name.zip"
          ln -s /Applications "out/$name/Applications"
          hdiutil create -volname Catenary -srcfolder "out/$name" -ov -format UDZO "signed/$name.dmg"
      # The runner is Apple silicon: it starts the arm64 app. The x64 app would run under Rosetta, which the runner may not have.
      - name: Desktop smoke test (signed macOS app)
        if: matrix.arch == 'arm64'
        # Not yet blocking: this test has not passed on a macOS runner. Make it blocking after the first green run.
        continue-on-error: true
        run: node scripts/smoke-desktop.mjs "out/Catenary-darwin-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: signed/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/packages/Catenary-linux-x64.tar.gz artifacts/packages/Catenary-linux-x64.AppImage artifacts/packages/Catenary-win32-x64.zip release/
          # The signed macOS packages replace the unsigned zips.
          cp artifacts/macos-*/* release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
