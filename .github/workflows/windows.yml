name: Windows

# The packages on real runners. ci.yml calls this workflow every night and for a PR with the label ci:full; release.yml calls it for the Windows
# smoke test of the release package. Manual run: Actions → Windows → Run workflow.
#  - package:  build the Linux and Windows packages on Linux, check the Windows layout, start the Linux package (xvfb), upload the zip.
#  - unit:     the tests of paths, files, the watcher and Git on Windows (real win32 paths, no path.win32 simulation).
#  - smoke:    extract the zip (artifact `inputs.artifact`) on Windows, start Catenary.exe (and Catenary.cmd), and drive them with scripts/smoke-desktop.mjs.

on:
  workflow_dispatch:
    inputs:
      unit:
        type: boolean
        default: true
      package:
        type: boolean
        default: true
      launcher:
        type: boolean
        default: true
  workflow_call:
    inputs:
      unit:
        type: boolean
        default: false
      package:
        type: boolean
        default: false
      # The smoke test of a zip that the caller uploaded (input artifact), without the package job (release.yml).
      smoke:
        type: boolean
        default: false
      # Catenary.cmd on the example folder: only a zip built with --example has one.
      launcher:
        type: boolean
        default: true
      # The artifact name of the zip: unique in one workflow run (ci.yml can call this workflow and release.yml together).
      artifact:
        type: string
        default: Catenary-win32-x64

permissions:
  contents: read

jobs:
  package:
    if: inputs.package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          install: full
      - run: pnpm build
      - run: bash scripts/package.sh linux-x64
      - name: Desktop smoke test (Linux package)
        run: xvfb-run -a node scripts/smoke-desktop.mjs dist/Catenary-linux-x64
      - run: pnpm package:win --example examples/bookshop
      - run: node scripts/check-windows-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'Catenary-win32-x64' }}
          path: dist/Catenary-win32-x64.zip
          compression-level: 0
          retention-days: 7

  unit:
    if: inputs.unit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The test fixtures compare text: keep the LF line ends of the repository. The smoke job checks CRLF files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # No install scripts: they build the Linux desktop app (drivelist, Electron for linux-x64). The unit tests do not need them.
      - uses: ./.github/actions/setup
      # The import rules: their path handling differs on Windows. The rest of `pnpm check` (links, CSS, TypeScript) is the same on
      # every platform; ci.yml runs it.
      - run: node scripts/check-boundaries.mjs
      # The tests of paths, files, the watcher and Git: what differs on Windows. The other tests are pure rules on RDF and diagrams,
      # the same on every platform; ci.yml runs all of them on Linux. On the Windows runner the full suite took 5 minutes, and its
      # CPU-heavy tests made Vitest time out ("Timeout calling onTaskUpdate") although all tests passed.
      # Separate processes: in the thread pool, a Vitest worker ended with a V8 fatal error ("unreachable code") on Windows.
      - shell: bash
        run: >-
          pnpm test --pool=forks
          packages/model/test/paths.test.ts packages/rdf/test/paths.test.ts packages/rdf-files/test/rdf-files.test.ts
          packages/rdf/test/watch.test.ts packages/rdf/test/workspace-files.test.ts packages/rdf/test/workspace.test.ts
          packages/rdf/test/review-save.test.ts packages/rdf/test/text-patch.test.ts packages/rdf/test/trig.test.ts
          modeler/test/electron-profile.test.ts

  smoke:
    needs: package
    if: always() && (inputs.package || inputs.smoke) && (needs.package.result == 'success' || needs.package.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact || 'Catenary-win32-x64' }}
      - name: Extract the package
        shell: pwsh
        run: Expand-Archive -Path Catenary-win32-x64.zip -DestinationPath dist
      - run: node scripts/check-windows-package.mjs dist\Catenary-win32-x64
      - name: Catenary.exe on a copy of the catalog
        run: node scripts/smoke-desktop.mjs dist\Catenary-win32-x64
      - name: Catenary.exe on CRLF files
        run: node scripts/smoke-desktop.mjs dist\Catenary-win32-x64 --crlf
      - name: Catenary.cmd on the bundled example
        if: inputs.launcher
        run: node scripts/smoke-desktop.mjs dist\Catenary-win32-x64 --launcher
