name: CI

# Each pull request and each push to main run the same jobs: `test` (static checks and unit tests) and `app` (browser build, CLI and
# RPC smoke test, browser tests). The only required check for a merge is `gate`.
# The nightly run, a manual run and a pull request with the label ci:full also run windows.yml: the Windows tests, the Electron build
# and the Linux and Windows packages. Add the label to a change of dependencies, Electron or packaging.
# A tag v* runs only release.yml. It requires a passed CI run on main for the commit.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check (links, import rules, style sheets, typecheck)
        run: pnpm -s check
      - name: Unit tests
        run: pnpm -s test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          install: backend
      - run: pnpm -s build:browser
      - name: CLI and RPC contract smoke test
        run: node scripts/smoke-cli.mjs
      - name: Browser tests
        env:
          # Two browser tests at a time on the 4 vCPUs of a runner (scripts/e2e.cjs).
          E2E_CONCURRENCY: 2
        run: |
          CHROMIUM="$(command -v chromium || command -v chromium-browser || command -v google-chrome)"
          export CHROMIUM
          pnpm -s e2e

  windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/windows.yml
    with:
      unit: true
      package: true

  gate:
    needs: [test, app, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job (windows without ci:full) passes. A failed or cancelled job fails the gate.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          ! jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$RESULTS" > /dev/null
